services:
  postgres:
    image: postgres:16-alpine
    container_name: vaultscout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaultscout
      POSTGRES_PASSWORD: vaultscout
      POSTGRES_DB: vaultscout
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultscout -d vaultscout"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
